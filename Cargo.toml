[package]
name = "koolie"
version = "0.1.0"
edition = "2024"

[dependencies]
ansi-to-tui = "8.0.1"
anyhow = "1.0.104"
async-trait = "0.1.92"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.34"
libc = "0.2.191"
notify-rust = "4.19.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["local-offset", "formatting", "macros", "parsing", "serde"] }
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.1"
unicode-width = "0.2.3"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["test-util", "full"] }
